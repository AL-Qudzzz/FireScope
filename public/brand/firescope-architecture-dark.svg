<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firescope-architecture-dark-title firescope-architecture-dark-desc" id="firescope-architecture-dark-root">
        <title id="firescope-architecture-dark-title">FireScope System Architecture</title>
        <desc id="firescope-architecture-dark-desc">Night Orbit dark-theme architecture showing NASA FIRMS and EONET live feeds and local Parquet and global preset archives flowing into the Express REST API, scientific engines, M3 cross-sensor harmonizer, and React 19 workspace.</desc>
        <defs>
      <style>#firescope-architecture-dark-root { --color-paper:   #0A1014;
      --color-paper-2: #16222B;
      --color-ink:     #ECF2F5;
      --color-muted:   #B2C2CC;
      --color-soft:    #8499A6;
      --color-accent:  #F0783C;
      --color-link:    #61BDE0;
      --font-sans:     'IBM Plex Sans', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace; }
      #firescope-architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #firescope-architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #firescope-architecture-dark-root .diagram-container { overflow-x: visible; }</style>
